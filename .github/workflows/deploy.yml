name: Deploy

on:
  push:
    branches:
      - master
      - next
      - prod

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose Application Environment Variables
        env:
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ secrets.REACT_APP_CLOUDINARY_CLOUD_NAME }}
          REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO: ${{ secrets.REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "prod" ]]; then
            echo "REACT_APP_OCM_ENV=production" >> "$GITHUB_ENV"
          else
            echo "REACT_APP_OCM_ENV=development" >> "$GITHUB_ENV"
          fi

          echo "REACT_APP_CLOUDINARY_CLOUD_NAME=$REACT_APP_CLOUDINARY_CLOUD_NAME" >> "$GITHUB_ENV"
          echo "REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO=$REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO" >> "$GITHUB_ENV"

      - name: Verify App
        run: pnpm build

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm exec firebase-ci deploy -s

      - name: Check SDK release
        if: github.ref_name == 'prod'
        id: sdk_release
        run: |
          version="$(node -p "require('./react-sdk/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create SDK prerelease
        if: github.ref_name == 'prod' && steps.sdk_release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.sdk_release.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "v${{ steps.sdk_release.outputs.version }}"
          --generate-notes
          --prerelease
