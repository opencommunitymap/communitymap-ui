name: Verify

on: [pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Use Development Firebase
        run: echo "REACT_APP_OCM_ENV=development" >> "$GITHUB_ENV"

      - name: Verify App
        run: yarn build

      - name: Install Chromium
        run: yarn workspace community-map playwright install --with-deps chromium

      - name: Smoke Test
        run: yarn test:e2e
