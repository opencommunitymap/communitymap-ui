name: Verify

on: [pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Expose Application Environment Variables
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          REACT_APP_GOOGLE_API_KEY: ${{ secrets.REACT_APP_GOOGLE_API_KEY }}
          MASTER_REACT_APP_GOOGLE_API_KEY: ${{ secrets.MASTER_REACT_APP_GOOGLE_API_KEY }}
          NEXT_REACT_APP_GOOGLE_API_KEY: ${{ secrets.NEXT_REACT_APP_GOOGLE_API_KEY }}
          PROD_REACT_APP_GOOGLE_API_KEY: ${{ secrets.PROD_REACT_APP_GOOGLE_API_KEY }}
          # these are optional
          PROD_REACT_APP_OCM_ENV: ${{ secrets.PROD_REACT_APP_OCM_ENV }}
          MASTER_REACT_APP_OCM_ENV: ${{ secrets.MASTER_REACT_APP_OCM_ENV }}
          NEXT_REACT_APP_OCM_ENV: ${{ secrets.NEXT_REACT_APP_OCM_ENV }}
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ secrets.REACT_APP_CLOUDINARY_CLOUD_NAME }}
          REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO: ${{ secrets.REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO }}
        run: |
          git_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          branch_prefix="$(printf '%s' "$git_branch" | tr '[:lower:]-/' '[:upper:]__')"
          branch_api_key_name="${branch_prefix}_REACT_APP_GOOGLE_API_KEY"
          branch_ocm_env_name="${branch_prefix}_REACT_APP_OCM_ENV"
          branch_api_key="$(printenv "$branch_api_key_name" || true)"
          branch_ocm_env="$(printenv "$branch_ocm_env_name" || true)"

          if [[ -n "$branch_api_key" ]]; then
            echo "Using Google API key for branch '$git_branch'"
            google_api_key="$branch_api_key"
          else
            echo "Falling back to the default Google API key"
            google_api_key="$REACT_APP_GOOGLE_API_KEY"
          fi

          if [[ -n "$branch_ocm_env" ]]; then
            echo "Using the OCM environment for branch '$git_branch'"
            echo "REACT_APP_OCM_ENV=$branch_ocm_env" >> "$GITHUB_ENV"
          fi

          echo "REACT_APP_GOOGLE_API_KEY=$google_api_key" >> "$GITHUB_ENV"
          echo "REACT_APP_CLOUDINARY_CLOUD_NAME=$REACT_APP_CLOUDINARY_CLOUD_NAME" >> "$GITHUB_ENV"
          echo "REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO=$REACT_APP_CLOUDINARY_UPLOAD_PRESET_LOGO" >> "$GITHUB_ENV"

      # Secrets are unavailable to pull requests from forks. The placeholder lets
      # the compile-only verification complete; it cannot access a Google API.
      - name: Expose Application Environment Variables (for fork)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "REACT_APP_GOOGLE_API_KEY=not-a-real-key" >> "$GITHUB_ENV"

      - name: Verify App
        run: yarn build
