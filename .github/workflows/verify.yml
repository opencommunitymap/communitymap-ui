name: Verify

on: [pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Use Development Firebase
        run: echo "REACT_APP_OCM_ENV=development" >> "$GITHUB_ENV"

      - name: Verify App
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter community-map exec playwright install --with-deps chromium

      - name: Smoke Test
        run: pnpm test:e2e
